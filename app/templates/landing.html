<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }}</title>
  <link rel="icon" href="/logo.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body class="min-h-screen text-white bg-gradient-to-br from-[#0a1126] via-[#10204e] to-[#22468f]">
  <main class="min-h-screen flex flex-col items-center justify-center text-center px-6">
    <div class="w-24 h-24 rounded-[1.4rem] shadow-2xl bg-gradient-to-br from-[#0c1330] via-[#1c3f9c] to-[#2f6df0] text-white flex items-center justify-center text-4xl">
      <i class="fa-solid fa-microphone-lines"></i>
    </div>
    <h1 class="text-5xl font-bold tracking-tight mt-7">{{ app_name }}</h1>
    <p class="text-blue-100/70 mt-4 max-w-md text-lg">
      Run voice interviews on autopilot - screen candidates and get a scored report, faster.
    </p>

    <div class="flex items-center gap-4 mt-9">
      {% if company %}
        <a href="/dashboard" class="bg-white text-gray-900 font-semibold px-7 py-3 rounded-md hover:bg-gray-100">Go to dashboard</a>
      {% else %}
        <a href="/register" class="bg-white text-gray-900 font-semibold px-7 py-3 rounded-md hover:bg-gray-100">Get started</a>
        <a href="/login" class="border border-white/30 text-white font-semibold px-7 py-3 rounded-md hover:bg-white/10">Log in</a>
      {% endif %}
    </div>
  </main>

  <footer class="absolute bottom-5 inset-x-0 text-center text-xs text-blue-100/40">© {{ app_name }}</footer>

  <a href="http://ariba.techyst.net/" target="_blank" rel="noopener"
     style="position:fixed;bottom:20px;right:20px;background:#000;color:#fff;font-size:11px;font-weight:600;padding:6px 12px;border-radius:4px;text-decoration:none;letter-spacing:0.04em;box-shadow:0 2px 8px rgba(0,0,0,0.25);z-index:9999;">
    Built with Ariba ↗
  </a>
</body>
</html>
