{% extends "base.html" %}
{% block title %}Verify your email · {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto text-center py-10">
  <div class="w-14 h-14 rounded-full bg-gray-900 text-white flex items-center justify-center mx-auto">✉️</div>
  <h1 class="text-2xl font-bold tracking-tight mt-4">Check your email</h1>
  <p class="text-gray-500 mt-2">
    We sent a verification link to <b>{{ email }}</b>. Click it to activate your account, then log in.
  </p>
  <p class="text-sm text-gray-400 mt-4">Didn't get it? Check spam, or <a href="/login" class="underline">try logging in</a> to resend.</p>
</div>
{% endblock %}
