{% extends "base.html" %}
{% block title %}Sign up · {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-2xl font-bold tracking-tight">Create your company account</h1>
  {% if error %}<p class="mt-3 text-sm text-red-600">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="mt-6 space-y-4">
    <div>
      <label class="text-sm font-semibold">Company name</label>
      <input name="name" required value="{{ name or '' }}" class="w-full border-b-[1.5px] border-gray-200 py-2 focus:outline-none focus:border-gray-900" placeholder="Acme Inc." />
    </div>
    <div>
      <label class="text-sm font-semibold">Work email</label>
      <input name="email" type="email" required value="{{ email or '' }}" class="w-full border-b-[1.5px] border-gray-200 py-2 focus:outline-none focus:border-gray-900" placeholder="you@acme.com" />
    </div>
    <div>
      <label class="text-sm font-semibold">Password</label>
      <input name="password" type="password" required minlength="8" class="w-full border-b-[1.5px] border-gray-200 py-2 focus:outline-none focus:border-gray-900" placeholder="At least 8 characters" />
    </div>
    <button class="w-full bg-neutral-900 text-white p-3 font-semibold hover:bg-black">Create account</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">Already have an account? <a href="/login" class="underline">Log in</a></p>
</div>
{% endblock %}
