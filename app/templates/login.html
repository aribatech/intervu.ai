{% extends "base.html" %}
{% block title %}Log in · {{ app_name }}{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto">
  <h1 class="text-2xl font-bold tracking-tight">Log in</h1>
  {% if error %}<p class="mt-3 text-sm text-red-600">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="mt-6 space-y-4">
    <div>
      <label class="text-sm font-semibold">Email</label>
      <input name="email" type="email" required value="{{ email or '' }}" class="w-full border-b-[1.5px] border-gray-200 py-2 focus:outline-none focus:border-gray-900" />
    </div>
    <div>
      <label class="text-sm font-semibold">Password</label>
      <input name="password" type="password" required class="w-full border-b-[1.5px] border-gray-200 py-2 focus:outline-none focus:border-gray-900" />
    </div>
    <button class="w-full bg-neutral-900 text-white p-3 font-semibold hover:bg-black">Log in</button>
  </form>
  <p class="text-sm text-gray-500 mt-4">New here? <a href="/register" class="underline">Create an account</a></p>
</div>
{% endblock %}
